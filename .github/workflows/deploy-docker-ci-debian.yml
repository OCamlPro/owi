name: deploy-docker-ci-debian

on:
  schedule:
    # 04:00 UTC every Monday
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        run: |
          docker build \
            -f packaging/docker/ci/debian/Dockerfile \
            -t kumikode/owi-ci:debian-latest \
            .
      - name: Push image
        run: |
          docker push kumikode/owi-ci:debian-latest
